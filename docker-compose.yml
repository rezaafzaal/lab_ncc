# docker-compose.yml
version: '3.9'

services:
  health-service:
    build: .                          # build from Dockerfile in current directory
    container_name: health-service
    ports:
      - "3000:3000"                   # host:container
    env_file:
      - .env                          # load variables from .env file
    restart: unless-stopped           # auto-restart unless you manually stop it
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
